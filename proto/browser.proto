syntax = "proto3";

package browser;

option go_package = "./;pb";

message RegisterResponse {
  bool success = 1;
  string error_message = 2;
  string session_token = 3;
  string access_token = 4;
  string device_id = 5;
  bool plus_trial_eligible = 6;
  string checkout_url = 7;
  bool plus_trial_checked = 8;
  reserved 9 to 11;
}

message StartRegisterResponse {
  bool success = 1;
  string error_message = 2;
  string browser_session_id = 3;
  bool otp_required = 4;
  RegisterResponse result = 5;
  int64 otp_issued_after_unix = 6;
  string stage = 7;
  string status_message = 8;
  int64 otp_wait_started_at_unix = 9;
  int64 otp_request_action_started_at_unix = 10;
}

message CancelRegisterResponse {
  bool success = 1;
  string error_message = 2;
}
