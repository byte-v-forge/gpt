syntax = "proto3";

package gpt_account;

import "byte/v/forge/contracts/account/v1/account.proto";

option go_package = "./;pb";

message Account {
  reserved 1, 2, 3, 4, 5, 6, 7;
  reserved "account_id", "email", "password", "status", "error_message", "session_token";
  string charge_ref = 8;
  reserved 9, 10, 11, 12, 13;
  reserved "first_name", "last_name", "dob", "created_at", "updated_at";
  reserved 14;
  reserved "access_token";
  optional bool plus_trial_eligible = 15;
  optional bool plus_active = 16;
  string tier = 17;
  optional string activation_channel = 18;
  string primary_mailbox_email = 19;
  reserved 20, 21, 22, 23, 24, 25, 26;
  reserved "mailbox_last_fetched_at_unix", "mailbox_last_message_at_unix", "mailbox_latest_otp", "mailbox_latest_otp_subject", "mailbox_latest_otp_received_at_unix", "codex_auth_json", "codex_auth_updated_at_unix";
  reserved 27, 28, 29, 30;
  reserved "codex_phone_confirmed", "codex_phone_label", "codex_phone_updated_at_unix", "codex_phone_status";
  byte.v.forge.contracts.account.v1.Account account = 31;
}

message AccountCredential {
  // Sensitive. Only gpt-account should persist it; Account projections must not carry it.
  string password = 1;
}

message CreateAccountRequest {
  Account account = 1;
  AccountCredential credential = 2;
}

message CreateAccountResponse {
  Account account = 1;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  Account account = 1;
  AccountCredential credential = 2;
}

message UpdateAccountResponse {
  Account account = 1;
}


message GetAccountCredentialRequest {
  string account_id = 1;
}

message GetAccountCredentialResponse {
  string account_id = 1;
  AccountCredential credential = 2;
}

message DeleteAccountRequest {
  string account_id = 1;
}

message DeleteAccountResponse {
  bool ack = 1;
}

message ListAccountsRequest {
  string status = 1;
  int32 limit = 2;
  string email = 3;
  string cursor = 4;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_cursor = 2;
}

message GPTEmailAllocation {
  string email = 1;
  string primary_email = 2;
  bool is_primary = 3;
  string status = 4;
  bool splittable = 5;
  string assigned_account_id = 6;
  string last_error = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message UpsertGPTEmailAllocationRequest {
  GPTEmailAllocation allocation = 1;
}

message UpsertGPTEmailAllocationResponse {
  GPTEmailAllocation allocation = 1;
}

message ListGPTEmailAllocationsRequest {
  string status = 1;
  int32 limit = 2;
  string primary_email = 3;
  bool splittable_only = 4;
  string cursor = 5;
  optional bool is_primary = 6;
  string email = 7;
}

message ListGPTEmailAllocationsResponse {
  repeated GPTEmailAllocation allocations = 1;
  string next_cursor = 2;
}

message ClaimGPTEmailAllocationRequest {
  string email = 1;
  string account_id = 2;
  string expected_status = 3;
  string status = 4;
  bool require_primary_splittable = 5;
  string expected_primary_status = 6;
}

message ClaimGPTEmailAllocationResponse {
  bool claimed = 1;
  GPTEmailAllocation allocation = 2;
}

message CreateGPTEmailAliasAllocationRequest {
  string primary_email = 1;
  string account_id = 2;
}

message CreateGPTEmailAliasAllocationResponse {
  bool created = 1;
  GPTEmailAllocation allocation = 2;
}

message MarkGPTEmailAllocationStatusRequest {
  string email = 1;
  string status = 2;
  string last_error = 3;
}

message MarkGPTEmailAllocationStatusResponse {
  GPTEmailAllocation allocation = 1;
}

service GPTAccountService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetAccountCredential(GetAccountCredentialRequest) returns (GetAccountCredentialResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc UpsertGPTEmailAllocation(UpsertGPTEmailAllocationRequest) returns (UpsertGPTEmailAllocationResponse);
  rpc ListGPTEmailAllocations(ListGPTEmailAllocationsRequest) returns (ListGPTEmailAllocationsResponse);
  rpc ClaimGPTEmailAllocation(ClaimGPTEmailAllocationRequest) returns (ClaimGPTEmailAllocationResponse);
  rpc CreateGPTEmailAliasAllocation(CreateGPTEmailAliasAllocationRequest) returns (CreateGPTEmailAliasAllocationResponse);
  rpc MarkGPTEmailAllocationStatus(MarkGPTEmailAllocationStatusRequest) returns (MarkGPTEmailAllocationStatusResponse);
}
