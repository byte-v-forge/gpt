syntax = "proto3";

package orchestrator;

import "google/protobuf/struct.proto";
import "account_db.proto";
import "mailbox_service.proto";

option go_package = "./;pb";

service AccountWorkflowService {
  rpc CreateGPTAccount(CreateGPTAccountRequest) returns (CreateGPTAccountResponse);
  rpc RegisterAccount(RegisterAccountRequest) returns (RegisterAccountResponse);
  rpc LoginAccount(LoginAccountRequest) returns (LoginAccountResponse);
  rpc CodexOAuth(CodexOAuthRequest) returns (CodexOAuthResponse);
  rpc CodexOAuthAddPhone(CodexOAuthAddPhoneRequest) returns (CodexOAuthAddPhoneResponse);
  rpc CodexOAuthBatchAddPhone(CodexOAuthBatchAddPhoneRequest) returns (CodexOAuthBatchAddPhoneResponse);
  rpc RegisterAndActivateAccount(RegisterAndActivateAccountRequest) returns (RegisterAndActivateAccountResponse);
  rpc FetchAccountMailbox(FetchAccountMailboxRequest) returns (FetchAccountMailboxResponse);
  rpc SyncAccountMailboxes(SyncAccountMailboxesRequest) returns (SyncAccountMailboxesResponse);
}

enum AccountEmailStrategy {
  ACCOUNT_EMAIL_STRATEGY_UNSPECIFIED = 0;
  ACCOUNT_EMAIL_STRATEGY_EXPLICIT = 1;
  ACCOUNT_EMAIL_STRATEGY_OUTLOOK_PRIMARY = 2;
  ACCOUNT_EMAIL_STRATEGY_OUTLOOK_ALIAS = 3;
}

enum RegisterOTPMode {
  REGISTER_OTP_MODE_UNSPECIFIED = 0;
  REGISTER_OTP_MODE_AUTO = 1;
  REGISTER_OTP_MODE_MANUAL = 2;
}

message RegisterOTPOptions {
  RegisterOTPMode mode = 1;
  optional bool auto_resend = 2;
  int32 first_wait_seconds = 3;
  int32 timeout_seconds = 4;
}

message AccountSpec {
  string account_id = 1;
  string email = 2;
  string password = 3;
  reserved 4;
  reserved "use_split_strategy";
  AccountEmailStrategy email_strategy = 5;
}

message AccountRef {
  string account_id = 1;
  bool plus_trial_known = 2;
  bool plus_trial_eligible = 3;
  bool plus_active = 4;
  string tier = 5;
}

message EnsureAccountInput {
  AccountSpec account = 1;
}

message CreateGPTAccountRequest {
  string email = 1;
  string password = 2;
  string account_id = 3;
  reserved 4;
  reserved "use_split_strategy";
  AccountEmailStrategy email_strategy = 5;
}

message CreateGPTAccountResponse {
  accountdb.Account account = 1;
  string error_message = 2;
}

message FetchAccountMailboxRequest {
  string account_id = 1;
  int32 limit_per_mailbox = 2;
}

message FetchAccountMailboxResponse {
  accountdb.Account account = 1;
  mailbox.FetchMailboxInboxesResponse inbox = 2;
  string error_message = 3;
}

message SyncAccountMailboxesRequest {
  int32 limit_per_mailbox = 1;
  int32 account_limit = 2;
}

message SyncAccountMailboxesResponse {
  bool success = 1;
  string error_message = 2;
  int32 account_count = 3;
  int32 mailbox_count = 4;
  int32 synced_count = 5;
  int32 failed_count = 6;
  int32 message_count = 7;
  int64 max_message_at_unix = 8;
}

message PersistRegisteredInput {
  string account_id = 1;
  string session_token = 2;
  string access_token = 3;
  bool plus_trial_eligible = 4;
  bool plus_trial_checked = 5;
}

message RegisterActivityOutput {
  string session_token = 1;
  string access_token = 2;
  string device_id = 3;
  bool plus_trial_eligible = 4;
  bool plus_trial_checked = 5;
  string checkout_url = 6;
  google.protobuf.Struct data = 7;
}

message BrowserAuthStartInput {
  string job_id = 1;
  string account_id = 2;
  string mode = 3;
}

message BrowserAuthStartOutput {
  string account_id = 1;
  string flow_id = 2;
  string email = 3;
  bool otp_required = 4;
  int64 otp_issued_after_unix = 5;
  int32 otp_timeout_seconds = 6;
  RegisterActivityOutput result = 7;
  google.protobuf.Struct data = 8;
  int64 otp_wait_started_at_unix = 9;
  int64 otp_request_action_started_at_unix = 10;
}

message BrowserAuthCompleteInput {
  string job_id = 1;
  string account_id = 2;
  string flow_id = 3;
  string mode = 4;
  string otp_param = 5;
  string submitted_at_param = 6;
  int64 otp_issued_after_unix = 7;
  string otp_source = 8;
}

message BrowserAuthResendOTPInput {
  string job_id = 1;
  string account_id = 2;
  string flow_id = 3;
  string mode = 4;
}

message BrowserAuthResendOTPOutput {
  string flow_id = 1;
  string email = 2;
  bool success = 3;
  string error_message = 4;
  int64 otp_issued_after_unix = 5;
  int64 otp_request_started_at_unix_ms = 6;
  int32 otp_timeout_seconds = 7;
  google.protobuf.Struct data = 8;
}

message BrowserAuthWaitInput {
  string job_id = 1;
  string account_id = 2;
  string flow_id = 3;
  string mode = 4;
  string email = 5;
}

message BrowserAuthWaitOutput {
  string account_id = 1;
  string flow_id = 2;
  string email = 3;
  bool otp_required = 4;
  int64 otp_issued_after_unix = 5;
  int32 otp_timeout_seconds = 6;
  RegisterActivityOutput result = 7;
  google.protobuf.Struct data = 8;
  int64 otp_wait_started_at_unix = 9;
  int64 otp_request_action_started_at_unix = 10;
}

message BrowserAuthCancelInput {
  string flow_id = 1;
  string mode = 2;
}

message LoginSessionActivityOutput {
  string session_token = 1;
  string access_token = 2;
  string device_id = 3;
  google.protobuf.Struct data = 4;
}

message RegisterAccountRequest {
  string email = 1;
  string password = 2;
  reserved 3, 4, 5;
  reserved "first_name", "last_name", "dob";
  string account_id = 6;
  reserved 7;
  reserved "use_split_strategy";
  AccountEmailStrategy email_strategy = 8;
  RegisterOTPOptions otp_options = 9;
}

message RegisterAccountResponse {
  string job_id = 1;
  string session_token = 2;
  bool plus_trial_eligible = 3;
  string error_message = 4;
  string checkout_url = 5;
  string access_token = 6;
  bool started = 7;
}

message LoginAccountRequest {
  string account_id = 1;
}

message LoginAccountResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthRequest {
  string account_id = 1;
  string label = 2;
}

message CodexOAuthResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthAddPhoneRequest {
  string account_id = 1;
  string label = 2;
  int32 max_reuse_count = 3;
}

message CodexOAuthAddPhoneResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthBatchAddPhoneRequest {
  repeated string account_ids = 1;
  string label = 2;
  int32 max_reuse_count = 3;
}

message CodexOAuthBatchAddPhoneResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message RegisterAndActivateAccountRequest {
  reserved 1, 2, 3, 4, 5, 8, 9, 10, 12;
  reserved "use_split_strategy";
  string email = 6;
  string password = 7;
  string account_id = 11;
  AccountEmailStrategy email_strategy = 13;
  RegisterOTPOptions otp_options = 14;
  string gopay_phone = 15;
  string gopay_country_code = 16;
  string gopay_pin = 17;
}

message RegisterAndActivateAccountResponse {
  string job_id = 1;
  string session_token = 2;
  bool plus_trial_eligible = 3;
  string checkout_url = 4;
  bool activation_success = 5;
  string error_message = 6;
  string charge_ref = 7;
  string snap_token = 8;
  string access_token = 9;
  bool started = 10;
}

message RegisterAccountWorkflowInput {
  string job_id = 1;
  AccountSpec account = 2;
  RegisterOTPOptions otp_options = 3;
}

message RegisterAccountWorkflowResult {
  string job_id = 1;
  string session_token = 2;
  string access_token = 3;
  bool plus_trial_eligible = 4;
  string checkout_url = 5;
  string error_message = 6;
}

message LoginSessionWorkflowInput {
  string job_id = 1;
  string account_id = 2;
}

message LoginSessionWorkflowResult {
  string job_id = 1;
  string session_token = 2;
  string access_token = 3;
  string error_message = 4;
}

message CodexOAuthWorkflowInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
}

message CodexOAuthWorkflowResult {
  string job_id = 1;
  bool success = 2;
  string error_message = 3;
  string auth_secret_key = 4;
  bool add_phone_required = 5;
}

message CodexOAuthAddPhoneWorkflowInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  int32 max_reuse_count = 4;
}

message CodexOAuthAddPhoneWorkflowResult {
  string job_id = 1;
  bool success = 2;
  string error_message = 3;
  string auth_secret_key = 4;
  string phone_label = 5;
  int32 phone_reuse_count = 6;
  int32 phone_reuse_limit = 7;
}

message CodexOAuthBatchAddPhoneWorkflowInput {
  string job_id = 1;
  repeated string account_ids = 2;
  string label = 3;
  int32 max_reuse_count = 4;
}

message CodexOAuthBatchAddPhoneWorkflowResult {
  string job_id = 1;
  bool success = 2;
  string error_message = 3;
  int32 total_count = 4;
  int32 success_count = 5;
  int32 add_phone_count = 6;
  int32 direct_oauth_count = 7;
  string stopped_reason = 8;
  string phone_label = 9;
  int32 phone_reuse_count = 10;
  int32 phone_reuse_limit = 11;
  repeated string processed_account_ids = 12;
}

message CodexOAuthAcquirePhoneInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  int32 max_reuse_count = 4;
}

message CodexOAuthPhoneLease {
  string activation_id = 1;
  string phone_e164 = 2;
  string phone_national = 3;
  string country_iso2 = 4;
  string country_calling_code = 5;
  string label = 6;
  int32 reuse_count = 7;
  int32 reuse_limit = 8;
  bool reused = 9;
  string profile_key = 10;
  int64 expires_at_unix = 11;
}

message CodexOAuthBrowserSession {
  string flow_id = 1;
  string session_id = 2;
  string state = 3;
  string pkce_secret_key = 4;
}

message CodexOAuthStartBrowserInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthPhoneLease phone = 4;
  bool allow_add_phone = 5;
}

message CodexOAuthStartBrowserOutput {
  bool success = 1;
  string error_message = 2;
  CodexOAuthBrowserSession session = 3;
  google.protobuf.Struct data = 4;
  string phone_label = 5;
}

message CodexOAuthBrowserStepInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthBrowserSession session = 4;
}

message CodexOAuthSubmitEmailOTPInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthBrowserSession session = 4;
  int64 issued_after_unix = 5;
}

message CodexOAuthBrowserStageOutput {
  bool success = 1;
  string error_message = 2;
  google.protobuf.Struct data = 3;
  string stage = 4;
  int64 email_otp_issued_after_unix = 5;
}

message CodexOAuthAddPhoneBrowserInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthPhoneLease phone = 4;
  bool allow_add_phone = 5;
  CodexOAuthBrowserSession session = 6;
}

message CodexOAuthAddPhoneBrowserOutput {
  bool success = 1;
  string error_message = 2;
  google.protobuf.Struct data = 3;
  bool add_phone_confirmed = 4;
  bool add_phone_required = 5;
  int32 phone_reuse_count = 6;
  int32 phone_reuse_limit = 7;
}

message CodexOAuthCompleteBrowserInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  bool mark_phone_confirmed_on_success = 4;
  CodexOAuthBrowserSession session = 5;
}

message CodexOAuthCompleteBrowserOutput {
  bool success = 1;
  string error_message = 2;
  string auth_secret_key = 3;
  google.protobuf.Struct data = 4;
}

message CodexOAuthStopBrowserInput {
  string job_id = 1;
  CodexOAuthBrowserSession session = 2;
  string reason = 3;
}

message CodexOAuthReleasePhoneInput {
  string job_id = 1;
  string account_id = 2;
  string activation_id = 3;
  string label = 4;
  string error_message = 5;
}

message RegisterAndActivateWorkflowInput {
  string job_id = 1;
  AccountSpec account = 2;
  RegisterOTPOptions otp_options = 3;
  string gopay_phone = 4;
  string gopay_country_code = 5;
  string gopay_pin = 6;
}

message RegisterAndActivateWorkflowResult {
  string job_id = 1;
  string session_token = 2;
  string access_token = 3;
  bool plus_trial_eligible = 4;
  string checkout_url = 5;
  bool activation_success = 6;
  string error_message = 7;
  string charge_ref = 8;
  string snap_token = 9;
}
