syntax = "proto3";

package orchestrator;

import "gpt_account.proto";
import "byte/v/forge/contracts/account/v1/account.proto";
import "byte/v/forge/contracts/mailbox/v1/mailbox.proto";
import "byte/v/forge/contracts/proxyruntime/v1/proxy_runtime.proto";
import "orchestrator_activity_data.proto";

option go_package = "./;pb";

service AccountWorkflowService {
  rpc CreateGPTAccount(CreateGPTAccountRequest) returns (CreateGPTAccountResponse);
  rpc FetchAccountMailbox(FetchAccountMailboxRequest) returns (FetchAccountMailboxResponse);
}

enum AccountEmailStrategy {
  ACCOUNT_EMAIL_STRATEGY_UNSPECIFIED = 0;
  ACCOUNT_EMAIL_STRATEGY_EXPLICIT = 1;
  ACCOUNT_EMAIL_STRATEGY_POOLED_PRIMARY = 2;
  ACCOUNT_EMAIL_STRATEGY_POOLED_ALIAS = 3;
  reserved "ACCOUNT_EMAIL_STRATEGY_OUTLOOK_PRIMARY", "ACCOUNT_EMAIL_STRATEGY_OUTLOOK_ALIAS";
}

enum RegisterOTPMode {
  REGISTER_OTP_MODE_UNSPECIFIED = 0;
  REGISTER_OTP_MODE_AUTO = 1;
  REGISTER_OTP_MODE_MANUAL = 2;
}

message RegisterOTPOptions {
  RegisterOTPMode mode = 1;
  optional bool auto_resend = 2;
  int32 first_wait_seconds = 3;
  int32 timeout_seconds = 4;
}

message AccountSpec {
  string account_id = 1;
  string email = 2;
  string password = 3;
  reserved 4;
  reserved "use_split_strategy";
  AccountEmailStrategy email_strategy = 5;
  string country_code = 6;
  string region = 7;
}

message AccountRef {
  string account_id = 1;
  bool plus_trial_known = 2;
  bool plus_trial_eligible = 3;
  bool plus_active = 4;
  string tier = 5;
}

message EnsureAccountInput {
  AccountSpec account = 1;
}

message CreateGPTAccountRequest {
  string email = 1;
  string password = 2;
  string account_id = 3;
  reserved 4;
  reserved "use_split_strategy";
  AccountEmailStrategy email_strategy = 5;
  string country_code = 6;
  string region = 7;
}

message CreateGPTAccountResponse {
  gpt_account.Account account = 1;
  string error_message = 2;
}

message FetchAccountMailboxRequest {
  string account_id = 1;
  int32 limit_per_mailbox = 2;
}

message FetchAccountMailboxResponse {
  gpt_account.Account account = 1;
  byte.v.forge.contracts.mailbox.v1.FetchMailboxInboxesResponse inbox = 2;
  string error_message = 3;
}

message AccountFingerprintRequest {
  string account_id = 1;
  string country_code = 2;
  string region = 3;
}

message AccountFingerprintResponse {
  string account_id = 1;
  bool generated = 2;
  string country_code = 3;
  string region = 4;
  string browser_profile_template = 5;
  string browser_family = 6;
  string browser_major_version = 7;
  string os_family = 8;
  string tls_profile_family = 9;
  string tls_fingerprint_variant = 10;
  string locale = 11;
  string timezone = 12;
  string user_agent = 13;
  string accept_language = 14;
  string language = 15;
  string device_id = 16;
  int64 created_at = 17;
  int64 updated_at = 18;
}

message UpdateAccountAuthRequest {
  string session_token = 1;
  string access_token = 2;
  optional string activation_channel = 3;
}

message AccountAuthResponse {
  reserved 1, 6, 7;
  reserved "account_id", "session_token_present", "access_token_present";
  string session_token = 2;
  int64 session_token_expires_at_unix = 3;
  string access_token = 4;
  int64 access_token_expires_at_unix = 5;
  byte.v.forge.contracts.account.v1.Account account = 8;
  string password = 9;
}

message AccountProxyUsage {
  string id = 1;
  string account_id = 2;
  string job_id = 3;
  string n8n_execution_id = 4;
  string purpose = 5;
  string proxy_url_hash = 6;
  string session_id_hash = 7;
  string exit_ip = 8;
  string country_code = 9;
  string region = 10;
  string city = 11;
  byte.v.forge.contracts.proxyruntime.v1.ProxyIPFraudCheck ip_fraud_check = 12;
  byte.v.forge.contracts.proxyruntime.v1.ProxyEdgeAccessCheck edge_access_check = 13;
  bool target_reachable = 14;
  uint32 attempt_index = 15;
  bool accepted = 16;
  string error_message = 17;
  int64 created_at = 18;
  byte.v.forge.contracts.proxyruntime.v1.ProxyDynamicIPSelectionPlan dynamic_ip_selection = 19;
}

message ListAccountProxyUsagesResponse {
  repeated AccountProxyUsage usages = 1;
}

message PersistRegisteredInput {
  string account_id = 1;
  string session_token = 2;
  string access_token = 3;
  bool plus_trial_eligible = 4;
  bool plus_trial_checked = 5;
}

message RegisterActivityOutput {
  string session_token = 1;
  string access_token = 2;
  string device_id = 3;
  bool plus_trial_eligible = 4;
  bool plus_trial_checked = 5;
  string checkout_url = 6;
  ActivityRegisterOutputData data = 7;
}

message BrowserAuthStartInput {
  string job_id = 1;
  string account_id = 2;
  string mode = 3;
}

message BrowserAuthStartOutput {
  string account_id = 1;
  string browser_session_id = 2;
  string email = 3;
  bool otp_required = 4;
  int64 otp_issued_after_unix = 5;
  int32 otp_timeout_seconds = 6;
  RegisterActivityOutput result = 7;
  ActivityBrowserAuthStartStepData data = 8;
  int64 otp_wait_started_at_unix = 9;
  int64 otp_request_action_started_at_unix = 10;
}

message ProtocolAuthStartInput {
  string job_id = 1;
  string account_id = 2;
  string mode = 3;
  string country_code = 4;
  string region = 5;
  string proxy_url = 6;
}

message ProtocolAuthStartOutput {
  string account_id = 1;
  string flow_id = 2;
  string email = 3;
  bool otp_required = 4;
  int64 otp_issued_after_unix = 5;
  int32 otp_timeout_seconds = 6;
  RegisterActivityOutput result = 7;
  ActivityProtocolAuthOutputData data = 8;
  int64 otp_wait_started_at_unix = 9;
  int64 otp_request_action_started_at_unix = 10;
}

message BrowserAuthCompleteInput {
  string job_id = 1;
  string account_id = 2;
  string browser_session_id = 3;
  string mode = 4;
  string otp_param = 5;
  string submitted_at_param = 6;
  int64 otp_issued_after_unix = 7;
  string otp_source = 8;
}

message BrowserAuthResendOTPInput {
  string job_id = 1;
  string account_id = 2;
  string browser_session_id = 3;
  string mode = 4;
}

message BrowserAuthResendOTPOutput {
  string browser_session_id = 1;
  string email = 2;
  bool success = 3;
  string error_message = 4;
  int64 otp_issued_after_unix = 5;
  int64 otp_request_started_at_unix_ms = 6;
  int32 otp_timeout_seconds = 7;
  ActivityBrowserAuthOTPRequestStepData data = 8;
}

message ProtocolAuthWaitInput {
  string job_id = 1;
  string account_id = 2;
  string flow_id = 3;
  string mode = 4;
  string email = 5;
  string proxy_url = 6;
}

message ProtocolAuthWaitOutput {
  string account_id = 1;
  string flow_id = 2;
  string email = 3;
  bool otp_required = 4;
  int64 otp_issued_after_unix = 5;
  int32 otp_timeout_seconds = 6;
  RegisterActivityOutput result = 7;
  ActivityProtocolAuthStepData data = 8;
  int64 otp_wait_started_at_unix = 9;
  int64 otp_request_action_started_at_unix = 10;
}

message ProtocolAuthCompleteInput {
  string job_id = 1;
  string account_id = 2;
  string flow_id = 3;
  string mode = 4;
  string otp_param = 5;
  string submitted_at_param = 6;
  int64 otp_issued_after_unix = 7;
  string otp_source = 8;
  string proxy_url = 9;
}

message ProtocolAuthCancelInput {
  string flow_id = 1;
  string mode = 2;
  string job_id = 3;
}

message BrowserAuthCancelInput {
  string browser_session_id = 1;
  string mode = 2;
  string job_id = 3;
}

message RegisterAccountRequest {
  string email = 1;
  string password = 2;
  reserved 3, 4, 5;
  reserved "first_name", "last_name", "dob";
  string account_id = 6;
  reserved 7;
  reserved "use_split_strategy";
  AccountEmailStrategy email_strategy = 8;
  RegisterOTPOptions otp_options = 9;
  string country_code = 10;
  string region = 11;
}

message RegisterAccountResponse {
  string job_id = 1;
  string session_token = 2;
  bool plus_trial_eligible = 3;
  string error_message = 4;
  string checkout_url = 5;
  string access_token = 6;
  bool started = 7;
}

message LoginAccountRequest {
  string account_id = 1;
}

message LoginAccountResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthRequest {
  string account_id = 1;
  string label = 2;
}

message CodexOAuthResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthAddPhoneRequest {
  string account_id = 1;
  string label = 2;
  int32 max_reuse_count = 3;
}

message CodexOAuthAddPhoneResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthBatchAddPhoneRequest {
  repeated string account_ids = 1;
  string label = 2;
  int32 max_reuse_count = 3;
}

message CodexOAuthBatchAddPhoneResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}

message CodexOAuthAcquirePhoneInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  int32 max_reuse_count = 4;
}

message CodexOAuthPhoneLease {
  string activation_id = 1;
  string phone_e164 = 2;
  string phone_national = 3;
  string country_iso2 = 4;
  string country_calling_code = 5;
  string label = 6;
  int32 reuse_count = 7;
  int32 reuse_limit = 8;
  bool reused = 9;
  string profile_key = 10;
  int64 expires_at_unix = 11;
}

message CodexOAuthBrowserSession {
  string flow_id = 1;
  string session_id = 2;
  string state = 3;
  string pkce_secret_key = 4;
}

message CodexOAuthStartBrowserInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthPhoneLease phone = 4;
  bool allow_add_phone = 5;
}

message CodexOAuthStartBrowserOutput {
  bool success = 1;
  string error_message = 2;
  CodexOAuthBrowserSession session = 3;
  ActivityCodexOAuthStepData data = 4;
  string phone_label = 5;
}

message CodexOAuthBrowserStepInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthBrowserSession session = 4;
}

message CodexOAuthSubmitEmailOTPInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthBrowserSession session = 4;
  int64 issued_after_unix = 5;
}

message CodexOAuthBrowserStageOutput {
  bool success = 1;
  string error_message = 2;
  ActivityCodexOAuthStepData data = 3;
  string stage = 4;
  int64 email_otp_issued_after_unix = 5;
}

message CodexOAuthAddPhoneBrowserInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  CodexOAuthPhoneLease phone = 4;
  bool allow_add_phone = 5;
  CodexOAuthBrowserSession session = 6;
}

message CodexOAuthAddPhoneBrowserOutput {
  bool success = 1;
  string error_message = 2;
  ActivityCodexOAuthStepData data = 3;
  bool add_phone_confirmed = 4;
  bool add_phone_required = 5;
  int32 phone_reuse_count = 6;
  int32 phone_reuse_limit = 7;
}

message CodexOAuthCompleteBrowserInput {
  string job_id = 1;
  string account_id = 2;
  string label = 3;
  bool mark_phone_confirmed_on_success = 4;
  CodexOAuthBrowserSession session = 5;
}

message CodexOAuthCompleteBrowserOutput {
  bool success = 1;
  string error_message = 2;
  string auth_secret_key = 3;
  ActivityCodexOAuthStepData data = 4;
}

message CodexOAuthStopBrowserInput {
  string job_id = 1;
  CodexOAuthBrowserSession session = 2;
  string reason = 3;
}

message CodexOAuthReleasePhoneInput {
  string job_id = 1;
  string account_id = 2;
  string activation_id = 3;
  string label = 4;
  string error_message = 5;
}
