syntax = "proto3";

package orchestrator;

import "orchestrator_activity_data.proto";

option go_package = "./;pb";

message ProbePlusTrialActivityInput {
  string job_id = 1;
  string account_id = 2;
  string access_token = 3;
  string session_token = 4;
  string proxy_url = 5;
}

message ProbeTierActivityInput {
  string job_id = 1;
  string account_id = 2;
  string proxy_url = 3;
}

message ProbePlusTrialActivityOutput {
  bool success = 1;
  bool checked = 2;
  bool plus_trial_eligible = 3;
  bool plus_active = 4;
  int64 amount = 5;
  string currency = 6;
  string source = 7;
  string plan_type = 8;
  string checkout_url = 9;
  string checkout_session_id = 10;
  string error_message = 11;
  ActivityProbePlusTrialStepData data = 12;
}

message ProbeTierActivityOutput {
  bool success = 1;
  bool checked = 2;
  string tier = 3;
  bool plus_active = 4;
  string source = 5;
  string error_message = 6;
  ActivityProbeTierStepData data = 7;
}

message ProbeAccountRequest {
  string account_id = 1;
}

message ProbeAccountResponse {
  string job_id = 1;
  bool started = 2;
  string error_message = 3;
}
