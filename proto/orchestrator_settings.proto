syntax = "proto3";

package orchestrator;

option go_package = "./;pb";

message GPTProxyPreflightSettings {
  bool enabled = 1;
  optional bool require_residential = 2;
  double min_ip_purity_score = 3;
  optional bool cf_canary_enabled = 4;
  uint32 max_proxy_attempts = 5;
  repeated string target_connectivity_urls = 6;
}

enum GPTPluginConfigFieldKind {
  GPT_PLUGIN_CONFIG_FIELD_KIND_UNSPECIFIED = 0;
  GPT_PLUGIN_CONFIG_FIELD_KIND_STRING = 1;
  GPT_PLUGIN_CONFIG_FIELD_KIND_SECRET = 2;
  GPT_PLUGIN_CONFIG_FIELD_KIND_INTEGER = 3;
  GPT_PLUGIN_CONFIG_FIELD_KIND_BOOLEAN = 4;
  GPT_PLUGIN_CONFIG_FIELD_KIND_DURATION_SECONDS = 5;
  GPT_PLUGIN_CONFIG_FIELD_KIND_URL = 6;
}

message GPTPluginConfigField {
  string key = 1;
  string label = 2;
  GPTPluginConfigFieldKind kind = 3;
  string default_value = 4;
  bool required = 5;
  string help_text = 6;
}

message GPTPluginConfigSchema {
  string plugin_key = 1;
  string display_name = 2;
  string owner = 3;
  repeated GPTPluginConfigField fields = 4;
}

message GPTPluginConfig {
  string plugin_key = 1;
  map<string, string> values = 2;
}

message GPTSettings {
  GPTProxyPreflightSettings proxy_preflight = 1;
  repeated GPTPluginConfig plugin_configs = 2;
}

message GetGPTSettingsResponse {
  GPTSettings settings = 1;
  string error_message = 2;
  repeated GPTPluginConfigSchema plugin_schemas = 3;
}

message UpdateGPTSettingsRequest {
  GPTSettings settings = 1;
}

message UpdateGPTSettingsResponse {
  GPTSettings settings = 1;
  string error_message = 2;
}
