syntax = "proto3";

package payment;

option go_package = "./;pb";

message ChatGPTCredential {
  string session_token = 1;
  string access_token = 2;
  ChatGPTRequestProfile request_profile = 3;
}

message ChatGPTRequestProfile {
  string proxy_url = 1;
  string tls_profile = 2;
  string user_agent = 3;
  string sec_ch_ua = 4;
  string sec_ch_ua_platform = 5;
  string accept_language = 6;
  string oai_language = 7;
  string locale = 8;
  string device_id = 9;
  string platform = 10;
  reserved 11;
  string proxy_ref = 12;
  string timezone = 13;
}

message ProbePlusTrialPaymentRequest {
  ChatGPTCredential credential = 1;
}

message ProbePlusTrialPaymentResponse {
  bool success = 1;
  string error_message = 2;
  bool checked = 3;
  bool plus_trial_eligible = 4;
  int64 amount = 5;
  string currency = 6;
  string source = 7;
  string checkout_url = 8;
  bool plus_active = 9;
  string plan_type = 10;
  string checkout_session_id = 11;
}

message CreateCheckoutLinkRequest {
  ChatGPTCredential credential = 1;
}

message CreateCheckoutLinkResponse {
  bool success = 1;
  string error_message = 2;
  string checkout_url = 3;
  string checkout_session_id = 4;
}

message ProbeTierPaymentRequest {
  ChatGPTCredential credential = 1;
}

message FetchAccessTokenPaymentRequest {
  ChatGPTCredential credential = 1;
}

message FetchAccessTokenPaymentResponse {
  bool success = 1;
  string error_message = 2;
  string access_token = 3;
}

message ProbeTierPaymentResponse {
  bool success = 1;
  string error_message = 2;
  bool checked = 3;
  string tier = 4;
  bool plus_active = 5;
  string source = 6;
}

service PaymentService {
  rpc CreateCheckoutLink(CreateCheckoutLinkRequest) returns (CreateCheckoutLinkResponse);
  rpc FetchAccessToken(FetchAccessTokenPaymentRequest) returns (FetchAccessTokenPaymentResponse);
  rpc ProbePlusTrial(ProbePlusTrialPaymentRequest) returns (ProbePlusTrialPaymentResponse);
  rpc ProbeTier(ProbeTierPaymentRequest) returns (ProbeTierPaymentResponse);
}
